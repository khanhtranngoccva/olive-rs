[package]
name = "olive-alloc"
description = "Fallible re-port of Rust's `alloc`: Vec, String, BTreeMap/Set, Rc/Arc, Cow, and friends, all allocating fallibly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Inherited from [workspace.dependencies]. The only runtime dependency is the
# foundation crate; everything else is built from scratch (we deliberately do NOT
# depend on the standard library's `alloc` crate — we control our own code).
olive-core = { workspace = true }

[build-dependencies]
olive-build = { workspace = true }

[dev-dependencies]
static_assertions = "1"

[lints]
workspace = true
